openapi: 3.1.0
info:
  title: 神州 HR 考勤系统 API
  version: 1.9.0-wave3
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    V1.9 WAVE-3 兼容版本上的 WAVE-4 预发布契约冻结：在完整保留 WAVE-1 本地账号、登录会话、权限、审计与
    版本化规则配置底座，以及 WAVE-2 组织、员工期初导入与本地人员权威的基础上，
    保留 WAVE-3 考勤配置面，并冻结考勤来源、统一证据账本与离线打卡导入接口。
    WAVE-3 FINAL 尚未随本变更提供，因此 WAVE-4 验收前置仍明确为未满足。
    所有 ID 均按 string 传输；响应和示例不包含密码、密码哈希、session token 或 reset token。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
x-delivery-contract:
  version: 1.0.0
  status: BINDING
  wave4ContractVersion: 1.10.0-wave4-prerelease
  activeStage: WAVE_3
  activeCallableSurface: paths
  plannedSurfacePolicy:
    callableWhenListedUnderPaths: true
    extensionEntriesAreCallable: false
    promotionRequires:
      - predecessor acceptance is PASS
      - request and response schemas are present under components
      - controller and OpenAPI operation closure is exact
      - authorization, audit, idempotency and concurrency tests pass
  prereleasePathPolicy:
    WAVE_4:
      pathPresence: CONTRACT_FREEZE_ONLY
      prerequisiteState: W3_FINAL_NOT_SUPPLIED
      callableClaimAllowedOnlyAfter:
        - W3 FINAL manifest and integrity PASS are synchronized
        - the operation has an exact runtime controller
        - its action, scope, audit, idempotency and concurrency tests pass
  transport:
    basePath: /api/v1
    mediaType: application/json
    identifiers: string
    timestamps: RFC3339
    dates: ISO8601_DATE
    pagination:
      request: [page, size]
      response: [items, page, size, totalElements, totalPages]
    errorEnvelope: '#/components/schemas/ApiError'
    requiredResponseHeaders: [X-Correlation-ID]
    mutationHeaders:
      csrf: X-CSRF-TOKEN
      idempotency: Idempotency-Key
      optimisticConcurrency: If-Match
      resourceVersion: ETag
  routeDecisions:
    attendanceGroupCollection:
      openApiPath: /attendance-setup/groups
      runtimePath: /api/v1/attendance-setup/groups
      frontendBasePath: /api/v1/attendance-setup
      backendRequestMapping: /api/v1/attendance-setup
      rejectedAliases:
        - path: /api/attendance/groups
          status: NOT_CALLABLE
          reason: Missing the versioned base path and the attendance-setup bounded-context segment.
  authorization:
    enforcement: SERVER
    default: DENY
    objectScopeRequired: true
    companyScopeRequired: true
    notFoundSemantics: REAL_404
  layers:
    direction:
      - controller
      - application-service
      - domain
      - repository-adapter
    transactionBoundary: application-service
    controllersContainBusinessRules: false
  migrations:
    immutableRange: V1-V6
    sequence:
      - { version: V7, stage: WAVE_3, purpose: attendance setup and policy storage }
      - { version: V8, stage: WAVE_4, purpose: source configuration and immutable evidence }
      - { version: V9, stage: WAVE_4, purpose: offline punch import }
      - { version: V10, stage: ATTENDANCE_CALCULATION, purpose: deterministic daily and monthly results }
      - { version: V11, stage: PERIOD_CLOSE, purpose: close, reopen and immutable snapshots }
      - { version: V12, stage: LEAVE_TIME_ACCOUNT, purpose: leave workflow and time ledger }
      - { version: V13, stage: SELF_SERVICE_REPORTING, purpose: feedback, export and display audit }
    emptyMigrationAllowed: false
  stages:
    WAVE_3:
      state: ACTIVE_CONTRACT_NOT_ACCEPTED
      dependsOn: [WAVE_2_ACCEPTED]
      requirements:
        - AC-POL-01..07
        - AC-ATTSET-01..05
        - AC-AUTH-11
        - AC-UI-01..07
        - AC-DB-04..13
      migration: V7
      pathPrefix: /attendance-setup
      activeOperationsSource: paths
      storagePolicyKinds:
        - MEAL_DEDUCTION
        - LATE_GRACE
        - MONTHLY_LATE_EXEMPTION
      compatibilityApiPolicyKinds:
        - MEAL_DEDUCTION
        - LATE_GRACE
        - MONTHLY_LATE_EXEMPTION
      policyKindProjection:
        MEAL_DEDUCTION: MEAL_DEDUCTION
        LATE_GRACE: LATE_GRACE
        MONTHLY_LATE_EXEMPTION: MONTHLY_LATE_EXEMPTION
    WAVE_4:
      state: IMPLEMENTATION_IN_PROGRESS_AWAITING_W3_FINAL
      prerequisiteEvidence: NOT_SUPPLIED
      dependsOn: [WAVE_3_ACCEPTED, WAVE_2_REGRESSION_PASS]
      requirements:
        - AC-PUNCH-01..15
        - AC-SOURCE-01
        - AC-CALC-01..04
        - AC-AUTH-10..11
      migrations: [V8, V9]
      models:
        - AttendanceSource
        - AttendanceSourceRevision
        - SourceCredentialReference
        - SourceMappingRevision
        - SourceSyncBatch
        - SourceCursor
        - RawAttendanceEvidence
        - NormalizedAttendanceEvent
        - EmployeeSourceBinding
        - OAQueryMappingProfile
        - PunchImportBatch
        - PunchImportError
      plannedOperations:
        - { method: GET, path: /attendance-sources, responseSchema: AttendanceSourcePage, errors: [401, 403] }
        - { method: POST, path: /attendance-sources, requestSchema: AttendanceSourceCreateRequest, responseSchema: AttendanceSourceView, errors: [400, 401, 403, 409, 422] }
        - { method: GET, path: '/attendance-sources/{sourceId}', responseSchema: AttendanceSourceView, errors: [401, 403, 404] }
        - { method: PATCH, path: '/attendance-sources/{sourceId}', requestSchema: AttendanceSourceUpdateRequest, responseSchema: AttendanceSourceView, errors: [400, 401, 403, 404, 409, 412, 422] }
        - { method: POST, path: '/attendance-sources/{sourceId}/connection-tests', requestSchema: SourceConnectionTestRequest, responseSchema: SourceConnectionTestView, errors: [400, 401, 403, 404, 409, 422, 503] }
        - { method: POST, path: /attendance-source-jobs, requestSchema: SourceSyncJobRequest, responseSchema: SourceSyncBatchView, errors: [400, 401, 403, 409, 422, 429, 503] }
        - { method: GET, path: '/attendance-source-jobs/{batchId}', responseSchema: SourceSyncBatchView, errors: [401, 403, 404] }
        - { method: POST, path: '/attendance-source-jobs/{batchId}/rerun', requestSchema: SourceSyncRerunRequest, responseSchema: SourceSyncBatchView, errors: [400, 401, 403, 404, 409, 422, 429] }
        - { method: GET, path: /employee-source-bindings, responseSchema: EmployeeSourceBindingPage, errors: [401, 403] }
        - { method: POST, path: /employee-source-bindings, requestSchema: EmployeeSourceBindingRequest, responseSchema: EmployeeSourceBindingView, errors: [400, 401, 403, 409, 422] }
        - { method: PATCH, path: '/employee-source-bindings/{bindingId}', requestSchema: EmployeeSourceBindingReviewRequest, responseSchema: EmployeeSourceBindingView, errors: [400, 401, 403, 404, 409, 412, 422] }
        - { method: GET, path: /oa-query-mapping-profiles, responseSchema: OAQueryMappingProfilePage, errors: [401, 403] }
        - { method: POST, path: /oa-query-mapping-profiles, requestSchema: OAQueryMappingProfileRequest, responseSchema: OAQueryMappingProfileView, errors: [400, 401, 403, 409, 422] }
        - { method: GET, path: /attendance-punch-imports/template, responseSchema: BinaryWorkbook, errors: [401, 403] }
        - { method: POST, path: /attendance-punch-imports, requestSchema: PunchImportCreateRequest, responseSchema: PunchImportBatchView, errors: [400, 401, 403, 409, 422] }
        - { method: PUT, path: '/attendance-punch-imports/{batchId}/file', requestSchema: ValidatedWorkbookUpload, responseSchema: PunchImportBatchView, errors: [400, 401, 403, 404, 409, 413, 415, 422] }
        - { method: POST, path: '/attendance-punch-imports/{batchId}/precheck', requestSchema: PunchImportPrecheckRequest, responseSchema: PunchImportPrecheckView, errors: [400, 401, 403, 404, 409, 422] }
        - { method: GET, path: '/attendance-punch-imports/{batchId}/errors', responseSchema: PunchImportErrorPage, errors: [401, 403, 404] }
        - { method: POST, path: '/attendance-punch-imports/{batchId}/publish', requestSchema: PunchImportPublishRequest, responseSchema: PunchImportBatchView, errors: [400, 401, 403, 404, 409, 422] }
        - { method: GET, path: '/attendance-events/{eventId}/evidence', responseSchema: RawAttendanceEvidenceView, errors: [401, 403, 404] }
    ATTENDANCE_CALCULATION:
      state: PLANNED_NON_CALLABLE
      dependsOn: [WAVE_4_ACCEPTED]
      requirements:
        - AC-ATTSET-06..09
        - AC-CALC-01..07
        - AC-AUTH-11
      migration: V10
      models:
        - EffectiveAttendanceEvent
        - AttendanceRuleSnapshot
        - OrganizationSnapshot
        - AttendanceDailyResult
        - AttendanceException
        - AttendanceAdjustment
        - AttendanceRecalculationBatch
        - AttendanceDifference
        - AttendanceMonthlyResult
      plannedOperations:
        - { method: GET, path: /attendance-daily-results, responseSchema: AttendanceDailyResultPage, errors: [401, 403] }
        - { method: GET, path: '/attendance-daily-results/{resultId}', responseSchema: AttendanceDailyResultView, errors: [401, 403, 404] }
        - { method: GET, path: /attendance-exceptions, responseSchema: AttendanceExceptionPage, errors: [401, 403] }
        - { method: POST, path: '/attendance-exceptions/{exceptionId}/adjustments', requestSchema: AttendanceAdjustmentRequest, responseSchema: AttendanceAdjustmentView, errors: [400, 401, 403, 404, 409, 422] }
        - { method: POST, path: /attendance-recalculations, requestSchema: AttendanceRecalculationRequest, responseSchema: AttendanceRecalculationBatchView, errors: [400, 401, 403, 409, 422] }
        - { method: GET, path: '/attendance-recalculations/{batchId}', responseSchema: AttendanceRecalculationBatchView, errors: [401, 403, 404] }
        - { method: GET, path: '/attendance-recalculations/{batchId}/differences', responseSchema: AttendanceDifferencePage, errors: [401, 403, 404] }
        - { method: GET, path: /attendance-monthly-results, responseSchema: AttendanceMonthlyResultPage, errors: [401, 403] }
    PERIOD_CLOSE:
      state: PLANNED_NON_CALLABLE
      dependsOn: [ATTENDANCE_CALCULATION_ACCEPTED]
      requirements:
        - AC-CLOSE-01..04
        - AC-AUTH-11
      migration: V11
      models:
        - AttendancePeriod
        - PeriodCloseSnapshot
        - PeriodCloseOperation
      plannedOperations:
        - { method: GET, path: /attendance-periods, responseSchema: AttendancePeriodPage, errors: [401, 403] }
        - { method: GET, path: '/attendance-periods/{periodId}', responseSchema: AttendancePeriodView, errors: [401, 403, 404] }
        - { method: POST, path: '/attendance-periods/{periodId}/freeze', requestSchema: PeriodFreezeRequest, responseSchema: AttendancePeriodView, errors: [400, 401, 403, 404, 409, 422] }
        - { method: POST, path: '/attendance-periods/{periodId}/close', requestSchema: PeriodCloseRequest, responseSchema: AttendancePeriodView, errors: [400, 401, 403, 404, 409, 422] }
        - { method: POST, path: '/attendance-periods/{periodId}/reopen', requestSchema: PeriodReopenRequest, responseSchema: AttendancePeriodView, errors: [400, 401, 403, 404, 409, 422] }
    LEAVE_TIME_ACCOUNT:
      state: PLANNED_NON_CALLABLE
      dependsOn: [PERIOD_CLOSE_ACCEPTED]
      requirements:
        - AC-LEAVE-01..04
        - AC-ANNUAL-01..09
        - AC-TIME-01..04
        - AC-AUTH-11
      migration: V12
      models:
        - LeaveType
        - LeaveTypeRevision
        - TimeAccount
        - TimeAccountLedgerEntry
        - LeaveRequest
        - LeaveReconciliation
      plannedOperations:
        - { method: GET, path: /leave-types, responseSchema: LeaveTypePage, errors: [401, 403] }
        - { method: POST, path: /leave-types, requestSchema: LeaveTypeCreateRequest, responseSchema: LeaveTypeView, errors: [400, 401, 403, 409, 422] }
        - { method: PATCH, path: '/leave-types/{leaveTypeId}', requestSchema: LeaveTypeUpdateRequest, responseSchema: LeaveTypeView, errors: [400, 401, 403, 404, 409, 412, 422] }
        - { method: GET, path: /leave-requests, responseSchema: LeaveRequestPage, errors: [401, 403] }
        - { method: POST, path: /leave-requests, requestSchema: LeaveRequestCreateRequest, responseSchema: LeaveRequestView, errors: [400, 401, 403, 409, 422] }
        - { method: POST, path: '/leave-requests/{leaveRequestId}/cancel', requestSchema: LeaveCancelRequest, responseSchema: LeaveRequestView, errors: [400, 401, 403, 404, 409, 422] }
        - { method: POST, path: /leave-reconciliations, requestSchema: LeaveReconciliationRequest, responseSchema: LeaveReconciliationView, errors: [400, 401, 403, 409, 422] }
        - { method: GET, path: /time-accounts, responseSchema: TimeAccountPage, errors: [401, 403] }
        - { method: GET, path: '/time-accounts/{accountId}/ledger', responseSchema: TimeAccountLedgerPage, errors: [401, 403, 404] }
        - { method: POST, path: '/time-accounts/{accountId}/replay', requestSchema: TimeAccountReplayRequest, responseSchema: TimeAccountReplayView, errors: [400, 401, 403, 404, 409, 422] }
    SELF_SERVICE_REPORTING:
      state: PLANNED_NON_CALLABLE
      dependsOn: [LEAVE_TIME_ACCOUNT_ACCEPTED]
      requirements:
        - AC-SELF-01
        - AC-FEEDBACK-01
        - AC-RANK-01..02
        - AC-POLICYCTR-01
        - AC-LOCATION-01
        - AC-DASH-01
        - AC-REPORT-01
        - AC-UI-01..07
        - AC-NFR-01..09
        - AC-AUTH-06
        - AC-AUTH-09..11
      migration: V13
      models:
        - SelfAttendanceCalendar
        - SelfAttendanceSummary
        - AttendanceFeedback
        - TeamAttendanceView
        - AttendanceReport
        - ReportExport
        - AttendanceDisplaySnapshot
      plannedOperations:
        - { method: GET, path: /me/attendance/calendar, responseSchema: SelfAttendanceCalendarView, errors: [401, 403] }
        - { method: GET, path: /me/attendance/monthly-summary, responseSchema: SelfAttendanceSummaryView, errors: [401, 403] }
        - { method: GET, path: /me/attendance/exceptions, responseSchema: SelfAttendanceExceptionPage, errors: [401, 403] }
        - { method: GET, path: /me/leave-requests, responseSchema: SelfLeaveRequestPage, errors: [401, 403] }
        - { method: GET, path: /me/attendance/feedback, responseSchema: AttendanceFeedbackPage, errors: [401, 403] }
        - { method: POST, path: /me/attendance/feedback, requestSchema: AttendanceFeedbackRequest, responseSchema: AttendanceFeedbackView, errors: [400, 401, 403, 409, 422] }
        - { method: GET, path: /team/attendance, responseSchema: TeamAttendancePage, errors: [401, 403] }
        - { method: GET, path: /attendance-reports/companies, responseSchema: AttendanceReportCompanyDirectory, errors: [401, 403] }
        - { method: GET, path: /attendance-reports, responseSchema: AttendanceReportPage, errors: [401, 403] }
        - { method: POST, path: /attendance-reports/exports, requestSchema: AttendanceReportExportCreateRequest, responseSchema: AttendanceReportExportView, errors: [400, 401, 403, 409] }
        - { method: GET, path: '/attendance-reports/exports/{exportId}', responseSchema: AttendanceReportExportView, errors: [401, 403, 404] }
        - { method: POST, path: '/attendance-reports/exports/{exportId}/download', requestSchema: ReportExportReauthenticationRequest, responseSchema: binary, errors: [400, 401, 403, 404, 409, 410] }
        - { method: GET, path: /display/attendance, responseSchema: AttendanceDisplaySnapshotView, errors: [401, 403] }
tags:
  - name: Authentication
    description: 本地账号登录、密码生命周期与服务端会话。
  - name: ReferenceData
    description: 管理表单使用的只读名称引用目录。
  - name: Access
    description: 账号、角色授权与服务端能力管理。
  - name: Audit
    description: 只读安全和业务审计事件查询。
  - name: Policy
    description: 通用版本化规则模板与受控生命周期。
  - name: PeopleImport
    description: 组织、员工、任职和入职前累计工龄的版本化 Excel 期初导入。
  - name: People
    description: 发布后的本地权威组织、员工、任职周期和累计工龄维护。
  - name: Compatibility
    description: V1.9 基线保留的既有主数据只读接口。
  - name: AttendanceSetup
    description: WAVE-3 考勤地点、考勤组、班次版本、工作日历和基础策略配置。
  - name: AttendanceSources
    description: WAVE-4 得力、OA 与文件来源配置、同步作业、水位和隔离证据。
  - name: PunchImports
    description: WAVE-4 离线异构 XLSX 模板、预检、发布、冲正和行级证据。
  - name: AttendanceEvidence
    description: WAVE-4 统一 raw→effective 证据追溯和近重复人工裁决。
  - name: AttendanceReports
    description: V1.9 正式考勤报表、异常报表及重新鉴权的受控 XLSX 导出。
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 使用本地账号密码登录
      security: []
      x-rate-limit: LOGIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功；session 只通过安全 Cookie 建立
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Host-only、HttpOnly、Path=/、SameSite=Lax；HTTPS 环境必须 Secure。
            X-CSRF-TOKEN:
              schema: { type: string }
              description: 后续状态变更请求使用的 CSRF token，不得持久化到浏览器存储。
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '423':
          $ref: '#/components/responses/AccountLocked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/session:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: 获取当前安全会话、能力和服务端菜单
      responses:
        '200':
          description: 当前会话
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-CSRF-TOKEN:
              schema: { type: string }
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 撤销当前会话并退出
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 当前会话已撤销
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: 修改当前账号密码并撤销其他会话
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 密码已修改；除当前重新建立的会话外，旧会话全部失效
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /auth/password/first-change:
    post:
      tags: [Authentication]
      operationId: completeFirstPasswordChange
      summary: 完成首次登录强制改密
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 首次改密完成并撤销旧会话
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/password-reset-requests:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: 发起不暴露账号存在性的密码恢复请求
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: 请求统一受理；无论账号是否存在均返回相同响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-resets:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: 使用一次性授权重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompletionRequest'
      responses:
        '204':
          description: 密码已重置；授权与旧会话全部失效
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidResetGrant'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/sessions/{sessionId}/revoke:
    post:
      tags: [Authentication]
      operationId: revokeSession
      summary: 撤销本人会话或具有权限的账号会话
      x-capability: ACCOUNT:EDIT
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: 会话已撤销
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
  /me/capabilities:
    get:
      tags: [Authentication]
      operationId: getCurrentCapabilities
      summary: 获取当前主体能力和服务端菜单
      responses:
        '200':
          description: 当前主体的最小能力视图
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCapabilities'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /me/attendance-dashboard:
    get:
      tags: [AttendanceReports]
      operationId: getSelfAttendanceDashboard
      summary: 获取当前登录员工本人的考勤工作台
      x-capability: ATTENDANCE_SELF:READ
      description: |
        仅从当前主体绑定员工、有效 SELF 数据范围及当月最新已发布投影读取。
        服务端再次按 principal.employee_id 过滤所有日事实和异常事实，不接受公司、
        组织或员工选择参数，也不返回组织分布或其他员工标识。投影未发布或当天数据
        尚未就绪时返回 409，不将缺失数据伪装为真实零值。
      responses:
        '200':
          description: 当前登录员工本人的月度指标、近七日趋势和未解决异常
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'

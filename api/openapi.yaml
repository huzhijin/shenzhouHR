            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/ResourceNotAvailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: 导出已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SHENZHOUHR_SESSION
      description: 本系统本地账号安全会话；开发身份头不属于正式认证路径。
  headers:
    CorrelationId:
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ETag:
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      description: 当前资源 row version 的强 ETag。
    IdempotencyReplayed:
      schema:
        type: boolean
      description: |
        `true` 表示本响应是已提交成功响应的精确持久化重放；
        `false` 表示当前请求首次提交成功。客户端不得自行推断此值。
    IdempotencyKeyEcho:
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      description: 精确回显本次已提交成功响应所绑定的幂等键。
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 主体、动作和规范请求摘要范围内的幂等键。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        必须等于服务端最近返回的强 ETag；集合创建使用 `"0"`。
        陈旧版本返回 409 `STALE_VERSION`。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    ChangeReason:
      name: X-Change-Reason
      in: header
      required: true
      description: |
        变更原因。浏览器客户端必须使用 `UTF-8''` 前缀加 RFC 3986 百分号编码，
        以避免 HTTP Header 的 ByteString 限制；未加前缀的 ASCII 值保持兼容。
        服务端解码后的变更原因长度必须为 2 至 500 个字符。
      schema: { type: string, minLength: 2, maxLength: 4510 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query

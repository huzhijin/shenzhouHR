      required:
        - exportId
        - reportType
        - period
        - companyId
        - deliveryMode
        - status
        - purpose
        - rowCount
        - expiresAt
      properties:
        exportId: { type: string, format: uuid }
        reportType:
          $ref: '#/components/schemas/AttendanceReportType'
        period:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        companyId: { type: string, minLength: 1, maxLength: 36 }
        deliveryMode:
          type: string
          enum: [SYNC, ASYNC]
        status:
          type: string
          enum: [READY, QUEUED, BUILDING, FAILED, EXPIRED]
        purpose: { type: string, minLength: 2, maxLength: 200 }
        rowCount: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
  responses:
    AuthenticationRequired:
      description: 身份无效、会话到期或会话已撤销
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidCredentials:
      description: 用户名或密码错误；不存在账号与错误密码使用相同外部响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidResetGrant:
      description: 重置授权无效、过期或已使用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AccountLocked:
      description: 账号已锁定；不返回账号存在性的额外信息
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AccessDenied:
      description: 已认证但动作、数据范围、记录状态或会话条件禁止
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ResourceNotAvailable:
      description: 对象不存在或主体无权读取，响应不区分原因
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationFailed:
      description: 请求字段、受控枚举或业务校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 状态、范围、生效期、冻结保护或唯一性冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    StaleVersion:
      description: 乐观锁版本过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: 触发登录或恢复请求频率限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PeopleConflict:
      description: WAVE-2 状态、幂等、版本、匹配、任职区间或受控撤销冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PeopleConflictError'
    AttendanceSetupConflict:
      description: WAVE-3 期限重叠、版本时间线、日历日期、策略歧义、冻结保护或并发冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UploadTooLarge:
      description: 文件超过受控上传大小
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedPeopleImportFile:
      description: 文件不是安全的 `.xlsx`，或包含宏、外链、可执行公式或危险压缩内容
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidRequest:
      description: W4 请求字段、受控枚举、multipart 部件或业务前置校验失败
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: XLSX 文件或解压后的安全边界超限
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnsupportedMediaType:
      description: 扩展名、声明 MIME、OOXML 信封或实际内容不一致
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    AttendanceSourcePageOk:

    PeopleImportTemplateType:
      type: string
      enum: [ORGANIZATION, EMPLOYEE, EMPLOYMENT, PRIOR_SERVICE]
    PeopleImportBatchStatus:
      type: string
      description: |
        严格状态机：
        DRAFT -> VALIDATING -> VALIDATION_FAILED | AWAITING_CONFIRMATION
        -> PUBLISHING -> PUBLISHED | PUBLISH_FAILED。
        DRAFT、VALIDATION_FAILED、AWAITING_CONFIRMATION 可转 VOIDED。
        PUBLISHED 不物理删除；受控撤销生成新的本地恢复版本。
      enum:
        [DRAFT, VALIDATING, VALIDATION_FAILED, AWAITING_CONFIRMATION,
         PUBLISHING, PUBLISHED, PUBLISH_FAILED, VOIDED]
      x-state-transitions:
        DRAFT: [VALIDATING, VOIDED]
        VALIDATING: [VALIDATION_FAILED, AWAITING_CONFIRMATION]
        VALIDATION_FAILED: [DRAFT, VALIDATING, VOIDED]
        AWAITING_CONFIRMATION: [DRAFT, VALIDATING, PUBLISHING, VOIDED]
        PUBLISHING: [PUBLISHED, PUBLISH_FAILED]
        PUBLISH_FAILED: [PUBLISHING]
        PUBLISHED: []
        VOIDED: []

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'self'; frame-ancestors 'none'"><title>V19-OD-03｜组织与员工期初导入</title><link rel="stylesheet" href="assets/v19-prototype.css"><link rel="stylesheet" href="assets/v19-utilities.css"></head>
<body class="preparing" data-artifact="V19-OD-03" data-route="/people/import" data-allowed-roles="hr">

<div class="dialog-backdrop" id="publish-org-dialog" hidden data-od-id="publish-organization-import-dialog"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="publish-org-title"><header class="dialog-head"><div><h2 id="publish-org-title">发布期初组织与员工数据</h2><p>高风险操作 · 将写入本地组织与任职档案</p></div><button class="btn btn-icon btn-ghost" type="button" data-close-dialog aria-label="关闭">×</button></header><div class="dialog-body"><div class="grid grid-2"><div><span class="muted">作用范围</span><strong data-display="block">江苏公司</strong></div><div><span class="muted">记录数</span><strong data-display="block">126 条</strong></div><div><span class="muted">业务日期</span><strong data-display="block">2026-07-01</strong></div><div><span class="muted">可逆性</span><strong data-display="block">发布后需通过受控更正</strong></div></div><div class="field" data-spacing="section-lg"><label for="org-publish-reason">发布原因</label><textarea class="textarea" id="org-publish-reason">V1.9 首次组织与员工期初建档</textarea></div></div><footer class="dialog-actions"><button class="btn" type="button" data-close-dialog>返回检查</button><button class="btn btn-primary" id="confirm-org-publish" type="button">发布 126 条记录</button></footer></section></div>
<script src="assets/v19-prototype.js"></script><script>
const h=V19.element;
let step=1;
const titles=['下载标准模板','上传组织与员工文件','字段与人员匹配','预校验结果','差异确认','发布结果'];
const captions=['模板版本 V1.9-ORG-01','草稿自动保存','仅使用受控字段','预校验不会写入正式数据','发布前最后核对','批次与审计已建立'];
function notice(kind,title,copy){return h('div',{className:'notice '+kind},h('div',{},h('strong',{text:title}),h('p',{text:copy})))}
function metric(label,value,className=''){return h('article',{className:'card metric-card'},h('span',{className:'metric-label',text:label}),h('strong',{className:'metric-value '+className,text:value}))}
function table(headers,rows){return h('div',{className:'table-card'},h('div',{className:'table-scroll'},h('table',{},h('thead',{},h('tr',{},headers.map(label=>h('th',{text:label})))),h('tbody',{},rows.map(row=>h('tr',{},row.map((cell,index)=>h('td',{'data-label':headers[index]},cell instanceof Node?cell:String(cell)))))))))}
function fieldMapping(sourceName,target,required,sample){return [sourceName,h('select',{className:'select','aria-label':'目标系统字段'},h('option',{text:target})),required,h('span',{className:'mono',text:sample})]}
function stepContent(number){
  const batch=V19.state.organization.batch;
  if(number===1)return h('div',{className:'grid grid-2'},h('article',{className:'card card-pad'},h('span',{className:'status info',text:'当前模板'}),h('h3',{text:'神州 HR 组织与员工期初导入模板'}),h('p',{className:'muted',text:'包含组织、岗位、员工、任职周期四个工作表；示例数据均为合成内容。'}),h('button',{className:'btn',id:'download-org-template',type:'button',text:'下载 V1.9-ORG-01'})),h('article',{className:'card card-pad'},h('h3',{text:'发布后如何维护'}),h('p',{text:'组织调整、员工入转调离和二次入职均在本系统维护。不会生成持续同步任务或入口。'})));
  if(number===2)return V19.fragment(h('div',{className:'field'},h('label',{for:'org-file',text:'选择 .xlsx 文件'}),h('input',{className:'input',id:'org-file',type:'file',accept:'.xlsx'}),h('span',{className:'field-hint',text:'演示文件：ORG-INIT-DEMO-001.xlsx · 126 行'})),notice('success','文件级检查通过','格式、工作表和模板版本可识别；已保存为可恢复草稿。'));
  if(number===3)return table(['源字段','系统字段','必填','样例'],[fieldMapping('员工编号','员工唯一标识','是','EMP-DEMO-001'),fieldMapping('最新入职日','任职周期开始日期','是','2024-07-15'),fieldMapping('入职前工龄月数','入职前累计工龄（月）','否','96')]);
  if(number===4)return V19.fragment(h('div',{className:'grid grid-4'},metric('总行数',batch.total),metric('有效',batch.valid),metric('错误',batch.errors,'danger-text'),metric('树结构冲突','0')),notice('warning','2 条字段错误需要修正','错误仍在预览层，不会写入正式数据。'));
  if(number===5){const status=()=>h('span',{className:'status '+(batch.errors?'warning':'success'),text:batch.errors?'待修正':'已修正'});const result=table(['行','对象','问题','建议修正','状态'],[['48','演示员工甲','任职周期日期格式','2024-07-15',status()],['87','研发一部','上级组织编码为空','江苏公司',status()]]);return batch.errors?V19.fragment(result,h('button',{className:'btn',id:'fix-org-errors',type:'button','data-spacing':'section',text:'应用建议修正'})):V19.fragment(result,notice('success','全部 126 条记录可发布','差异已确认，没有阻断项。'))}
  if(batch.status==='published')return h('div',{className:'empty'},h('span',{className:'status success',text:'已发布'}),h('h3',{text:'期初数据已进入本地组织与人员档案'}),h('p',{text:'发布批次 ORG-INIT-DEMO-001 · 126 条 · 2026-07-22 14:26'}),h('button',{className:'btn btn-primary',type:'button','data-route':'/people/organization','data-batch':'ORG-INIT-DEMO-001',text:'查看本地组织'}));
  return notice('warning','发布前确认',batch.errors+' 条错误；只有错误为 0 时才能正式发布。');
}
function render(){document.getElementById('step-title').textContent=titles[step-1];document.getElementById('step-caption').textContent=captions[step-1];document.getElementById('step-content').replaceChildren(stepContent(step));document.querySelectorAll('[data-step]').forEach((item,index)=>{item.classList.toggle('active',index===step-1);item.classList.toggle('done',index<step-1)});document.getElementById('step-back').disabled=step===1;const next=document.getElementById('step-next');next.textContent=step===6?'发布期初数据':'下一步：'+(titles[step]||'发布');next.hidden=step===6&&V19.state.organization.batch.status==='published';document.getElementById('batch-status-label').textContent=V19.state.organization.batch.status==='published'?'已发布':'待发布';wireLocal()}
function wireLocal(){const download=document.getElementById('download-org-template');if(download)download.onclick=()=>V19.toast('模板已准备','原型模拟下载 V1.9-ORG-01。');const fix=document.getElementById('fix-org-errors');if(fix)fix.onclick=()=>{V19.update({organization:{batch:{valid:126,errors:0}}},'2 条错误已在预览层修正。');render()};document.querySelectorAll('[data-route]').forEach(element=>{if(!element.dataset.routeBound){element.dataset.routeBound='1';element.onclick=event=>{event.preventDefault();V19.navigate(element.dataset.route,{batch:element.dataset.batch})}}})}
document.addEventListener('v19:ready',()=>{step=V19.state.organization.batch.status==='published'?6:1;render();document.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{step=Number(button.dataset.step);render()});document.getElementById('step-back').onclick=()=>{if(step>1){step--;render()}};document.getElementById('step-next').onclick=()=>{if(step<6){step++;render()}else if(V19.state.organization.batch.errors>0)V19.toast('暂不能发布','请先修正 2 条错误。');else V19.openDialog('publish-org-dialog')};document.getElementById('resume-import').onclick=()=>{step=4;render()};document.getElementById('confirm-org-publish').onclick=()=>{V19.update({organization:{batch:{status:'published',valid:126,errors:0,publishedAt:'2026-07-22 14:26'}}},'组织与员工期初数据已发布。');V19.closeDialog('publish-org-dialog');step=6;render()}});
</script></body></html>

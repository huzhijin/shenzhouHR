# Generated by UmaDev — CI pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - name: UmaDev quality gate
        run: |
          if [ -f output/*-quality-gate.json ]; then
            # Fail the build if the quality gate didn't pass.
            python3 -c "import json,glob; d=json.load(open(glob.glob('output/*-quality-gate.json')[0])); exit(0 if d['passed'] else 1)"
          fi

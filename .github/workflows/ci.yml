name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
      - name: UmaDev quality gate
        working-directory: ${{ github.workspace }}
        run: |
          if compgen -G "output/*-quality-gate.json" > /dev/null; then
            python3 -c "import json,glob; d=json.load(open(glob.glob('output/*-quality-gate.json')[0])); exit(0 if d['passed'] else 1)"
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Verify all sources compile (including W4 contract stubs) and run
      # unit tests. ExportedPeopleWorkbookContractTest skips cleanly when
      # -Dshenzhouhr.people-export-dir is absent (Assumptions guard).
      - run: ./mvnw -q test -DskipITs

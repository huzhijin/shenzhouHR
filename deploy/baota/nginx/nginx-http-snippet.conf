# Optional Baota Nginx http{} snippet. The site config works without it.
# Paste this into the http{} block only if you want shared request logging and limits.
log_format shenzhouhr_safe '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status '
    '$body_bytes_sent "$http_referer" "$http_user_agent" request_id=$request_id';
limit_req_zone $binary_remote_addr zone=shenzhouhr_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=shenzhouhr_per_ip:10m;

server {
    listen __SITE_PORT__;
    server_name __DOMAIN__;
    server_tokens off;

    root __WEB_ROOT__;
    index index.html;
    # Disable the default combined access log because it records query strings.
    access_log off;
    error_log /www/wwwlogs/__DOMAIN__.error.log;
    client_max_body_size 21m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    set $shenzhouhr_cache_control "no-store, max-age=0";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'nonce-$request_id'; script-src 'self'; connect-src 'self'" always;
    add_header Cache-Control $shenzhouhr_cache_control always;

    # Baota creates .user.ini in the web root. Never serve panel metadata,
    # repository metadata, or environment files as SPA fallbacks.
    location ~ (^|/)\.(?:user\.ini|env(?:[./]|$)|git(?:/|$)|svn(?:/|$)|hg(?:/|$)) {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        set $shenzhouhr_cache_control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        etag off;
        sub_filter __CSP_NONCE__ $request_id;
        sub_filter_once off;
    }
}

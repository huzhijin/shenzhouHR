server {
    listen 443 ssl http2;
    server_name shenzhouhr.internal;
    server_tokens off;

    ssl_certificate /etc/shenzhouhr/tls/server.crt;
    ssl_certificate_key /etc/shenzhouhr/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:SHENZHOUHR_TLS:10m;
    ssl_session_timeout 1h;

    root /opt/shenzhouhr/web;
    index index.html;
    client_max_body_size 21m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn shenzhouhr_per_ip 20;
    access_log /var/log/nginx/shenzhouhr.access.log shenzhouhr_safe;

    set $shenzhouhr_cache_control "no-store, max-age=0";

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'nonce-$request_id'; script-src 'self'; connect-src 'self'" always;
    add_header Cache-Control $shenzhouhr_cache_control always;

    location /api/ {
        limit_req zone=shenzhouhr_api burst=40 nodelay;
        limit_conn shenzhouhr_per_ip 12;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        set $shenzhouhr_cache_control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        etag off;
        sub_filter __CSP_NONCE__ $request_id;
        sub_filter_once off;
    }
}

server {
    listen 80;
    server_name shenzhouhr.internal;
    return 308 https://shenzhouhr.internal$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Install in /etc/nginx/conf.d so these directives are loaded in the http context.
# The access format intentionally records $uri rather than the original request
# target so credentials or personal data accidentally placed in a query string
# cannot enter the standard access log.
log_format shenzhouhr_safe
    '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent request_time=$request_time '
    'upstream_time=$upstream_response_time request_id=$request_id';

limit_req_zone $binary_remote_addr zone=shenzhouhr_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=shenzhouhr_per_ip:10m;

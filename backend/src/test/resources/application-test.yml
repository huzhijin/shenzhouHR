spring:
  datasource:
    url: jdbc:h2:mem:shenzhouhr-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/test-schema.sql
      data-locations: classpath:db/test-data.sql

shenzhouhr:
  development-principal:
    enabled: true
